[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amnmt"
version = "2.0.0a0"
description = "English <-> Amharic neural machine translation with a from-scratch PyTorch Transformer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Beka" }]
keywords = ["nmt", "transformer", "amharic", "machine-translation", "pytorch"]

# Core: what L0 (core) and the CLI need. Heavy layer-specific deps live in extras.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "torch>=2.3",
]

[project.optional-dependencies]
data = ["datasets>=2.19", "pyarrow>=15.0", "duckdb>=1.0"]
tokenization = ["tokenizers>=0.19"]
evaluation = ["sacrebleu>=2.4"]
serving = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "streamlit>=1.35"]
all = ["amnmt[data,tokenization,evaluation,serving]"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[project.scripts]
amnmt = "amnmt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amnmt"]

# --------------------------------------------------------------------------------------
# Quality tooling
# --------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: takes more than a few seconds; skipped in the default CI run"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# RUF001-003 flag "confusable" unicode; Ethiopic text is the point of this project.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["amnmt"]

[tool.mypy]
python_version = "3.12"  # dev interpreter; numpy stubs use `type` statements
packages = ["amnmt"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# Architecture contracts (enforced by `lint-imports`). See PLAN.md "Package layout".
# --------------------------------------------------------------------------------------

[tool.importlinter]
root_package = "amnmt"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: lower layers never import higher ones"
type = "layers"
layers = [
    "amnmt.cli",
    "amnmt.serving",
    "amnmt.evaluation",
    "amnmt.inference",
    "amnmt.training",
    "amnmt.model",
    "amnmt.tokenization",
    "amnmt.data",
    "amnmt.core",
]

[[tool.importlinter.contracts]]
name = "core has no ML dependencies"
type = "forbidden"
source_modules = ["amnmt.core"]
forbidden_modules = ["torch", "datasets", "tokenizers", "sacrebleu", "fastapi", "streamlit"]

[[tool.importlinter.contracts]]
name = "model is pure torch: no I/O, no config files, no data layer"
type = "forbidden"
source_modules = ["amnmt.model"]
forbidden_modules = ["yaml", "pyarrow", "duckdb", "datasets", "tokenizers", "amnmt.data", "amnmt.tokenization"]
