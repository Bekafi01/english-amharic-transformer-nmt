# Full-scale corpus. Runs on Colab/Kaggle; outputs go to Drive via `--root`.
project:
  name: full
  seed: 42
  device: auto

paths:
  root: .
  data_raw: data/raw
  data_processed: data/processed/full
  artifacts: artifacts/full

data:
  # Order = trust priority: when a normalized pair appears in several sources, the first wins.
  # All sources are public and documented in README (Data section).
  sources:
    - name: mt560
      kind: hf
      path: michsethowusu/english-amharic_sentence-pairs_mt560
      en_column: eng
      am_column: amh
      license: CC-BY-4.0
    - name: opus100
      kind: hf
      path: Helsinki-NLP/opus-100
      subset: am-en
      license: mixed (OPUS)
    - name: tanzil
      kind: opus_moses
      url: https://object.pouta.csc.fi/OPUS-Tanzil/v1/moses/am-en.txt.zip
      license: Tanzil
    - name: ccaligned
      kind: opus_moses
      url: https://object.pouta.csc.fi/OPUS-CCAligned/v1/moses/am-en.txt.zip
      license: CC (web crawl)
    - name: nllb
      kind: opus_moses
      url: https://object.pouta.csc.fi/OPUS-NLLB/v1/moses/am-en.txt.zip
      license: CC-BY-NC-4.0 (Meta, LASER-mined)
  holdout_size: 2000
  shard_flush_rows: 200000

tokenizer:
  vocab_size: 32000
  sample_per_lang: 2000000
  # Train the vocab on the medium-quality subset so noisy NLLB tail does not shape merges.
  subset:
    min_score:
      nllb: 1.068

model: # Transformer-base
  d_model: 512
  n_heads: 8
  d_ff: 2048
  n_encoder_layers: 6
  n_decoder_layers: 6
  dropout: 0.1
  max_len: 256
training:
  # `medium` subset (D12): all curated sources + NLLB above the p75 LASER score (~4.4M pairs).
  subset:
    min_score:
      nllb: 1.068
  directions: [en-am, am-en]
  max_len: 128
  batch_tokens: 8000 # T4 16 GB with fp16; raise to 12000 on an A100
  accumulation_steps: 3 # effective ~24k tokens/step
  peak_lr: 7.0e-4
  warmup_steps: 4000
  label_smoothing: 0.1
  max_steps: 100000
  log_every: 100
  eval_every: 2000
  save_every: 2000
  n_samples: 4
  num_workers: 2
