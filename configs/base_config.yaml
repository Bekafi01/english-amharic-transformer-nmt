# Global Project & Hardware Configuration

project_name: "english-amharic-transformer-nmt"
seed: 42
device: "cuda"  # Auto-falls back to cpu if cuda is unavailable
num_workers: 4

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  tokenizer_dir: "artifacts/tokenizers"
  checkpoint_dir: "artifacts/checkpoints"
  onnx_dir: "artifacts/onnx"
  benchmarks_dir: "artifacts/benchmarks"
  tensorboard_dir: "artifacts/tensorboard"

logging:
  level: "INFO"
  log_to_file: true
  log_file: "artifacts/training.log"
  rich_formatting: true
