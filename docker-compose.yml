# ==============================================================================
# Docker Compose Specification for English-Amharic NMT Service
# ==============================================================================
version: "3.8"

services:
  nmt-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-amharic-nmt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NMT_MODEL_PATH=/app/checkpoints/best_model.pt
      - NMT_TOKENIZER_PATH=/app/artifacts/tokenizers/joint_bpe_32k.json
      - NMT_DEVICE=cpu
    volumes:
      # Mount host checkpoints and artifacts into the container
      - ./checkpoints:/app/checkpoints:ro
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
